# Render Blueprint for CampusHub: ONE web service (API + website on the same URL) and ONE
# PostgreSQL database. Render dashboard → New → Blueprint → choose your repository.
#
# Render looks for this file at the root of your Git repository. If this `campushub` folder is a
# subfolder of your repository, move this file to the repository root and uncomment `rootDir`.
#
# Free-plan notes: the web service sleeps after 15 minutes without traffic (the next visit takes
# about a minute), uploaded images are lost on restarts (no persistent disk on the free plan), and
# a free Render PostgreSQL database expires after 30 days. See README → "Deploying to Render".
services:
  - type: web
    name: campushub
    runtime: node
    plan: free
    # rootDir: campushub
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campushub-db
          property: connectionString
      # the API also serves the built website, so everyone uses one URL
      - key: SERVE_FRONTEND
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      # First administrator, created on the first start (choose your own; remove the password afterwards)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: real email for password resets (otherwise reset links only appear in the logs)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # APP_URL defaults to this service's onrender.com address; set it if you add a custom domain.

databases:
  - name: campushub-db
    plan: free
    databaseName: campushub
    user: campushub
